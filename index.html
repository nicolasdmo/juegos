<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Juego</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000; color: #ccc;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }
  #game {
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  /* ----- Modo kiosko: esconder controles y menú de EmulatorJS ----- */
  /* Barra de menú inferior */
  .ejs_menu_bar,
  .ejs_menu_bar_hidden,
  .ejs_menu_button,
  .ejs_settings_parent,
  .ejs_cheat_parent,
  .ejs_netplay_parent,
  .ejs_save_states_menu,
  .ejs_volume_parent,
  .ejs_context_menu,
  .ejs_popout_container {
    display: none !important;
  }
  /* Pantalla de inicio (botón "Play") y splash */
  .ejs_start_button { /* lo dejamos porque algunos navegadores requieren un click para habilitar audio */ }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

  <div id="game"></div>

  <script>
    // ---- CONFIG ----
    // Cambiá esta línea si tu ROM tiene otro nombre.
    var EJS_gameUrl    = 'mon.gb';

    // Core: 'gb' funciona para GB y GBC. Si querés forzar GBC, usá 'gbc'.
    var EJS_core       = 'gb';

    var EJS_player     = '#game';
    var EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    var EJS_startOnLoaded = true;        // arranca solo, sin click extra
    var EJS_color      = '#1a1a1a';
    var EJS_volume     = 0.6;
    var EJS_disableDatabases = true;     // no guarda info del usuario
    var EJS_Buttons = {                  // esconder todos los botones de la UI
      playPause: false,
      restart: false,
      mute: false,
      settings: false,
      fullscreen: true,                  // dejamos solo fullscreen
      saveState: false,
      loadState: false,
      screenRecord: false,
      gamepad: false,
      cheat: false,
      volume: false,
      saveSavFiles: false,
      loadSavFiles: false,
      quickSave: false,
      quickLoad: false,
      screenshot: false,
      cacheManager: false,
      exitEmulation: false
    };

    // Bloqueos extra para modo kiosko
    document.addEventListener('keydown', function (e) {
      // Bloquear atajos del navegador (Ctrl+S, Ctrl+P, etc.)
      if (e.ctrlKey || e.metaKey) {
        var k = (e.key || '').toLowerCase();
        if (['s','p','u','o','j','f','w','t','n','r'].indexOf(k) !== -1) {
          e.preventDefault();
        }
      }
    });
    window.addEventListener('dragover', function (e) { e.preventDefault(); });
    window.addEventListener('drop',     function (e) { e.preventDefault(); });
  </script>

  <!-- Cargador oficial de EmulatorJS -->
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
