<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arcade</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #0a0a0a; color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  body { touch-action: none; }

  /* ===== Screens ===== */
  .screen { display: none; width: 100vw; height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== Register ===== */
  #screen-register { align-items: center; justify-content: center; padding: 16px; }
  .register-card {
    background: #161616; border: 1px solid #2a2a2a; border-radius: 14px;
    padding: 28px; width: 100%; max-width: 380px;
  }
  .register-card h1 { margin: 0 0 4px; font-size: 24px; font-weight: 600; }
  .register-card .subtitle { color: #888; font-size: 13px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px 14px; background: #0a0a0a;
    border: 1px solid #2a2a2a; border-radius: 8px;
    color: #fff; font-size: 15px;
    -webkit-user-select: text; user-select: text;
  }
  .field input:focus { outline: none; border-color: #555; }
  .btn-primary {
    width: 100%; padding: 13px; background: #4070d0; border: none; border-radius: 8px;
    color: #fff; font-size: 15px; font-weight: 500; cursor: pointer;
    margin-top: 4px;
  }
  .btn-primary:hover { background: #5080e0; }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { background: #2a2a2a; color: #666; cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; text-align: center; }
  .msg.error { color: #ff6b6b; }
  .msg.ok    { color: #4caf50; }

  /* ===== Picker ===== */
  #screen-picker { padding: 16px; }
  .picker-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-shrink: 0;
  }
  .picker-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .picker-header .user-info { display: flex; align-items: center; gap: 10px; }
  .picker-header .hello { color: #888; font-size: 13px; }

  .search-bar {
    position: relative; margin-bottom: 12px; flex-shrink: 0;
  }
  .search-bar input {
    width: 100%; padding: 10px 14px 10px 36px;
    background: #161616; border: 1px solid #2a2a2a; border-radius: 8px;
    color: #fff; font-size: 14px;
    -webkit-user-select: text; user-select: text;
  }
  .search-bar input:focus { outline: none; border-color: #555; }
  .search-bar input::placeholder { color: #555; }
  .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: #555; font-size: 15px; pointer-events: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
    overflow-y: auto;
    flex: 1;
    padding-bottom: 16px;
  }
  .rom-card {
    background: #161616; border: 1px solid #2a2a2a; border-radius: 10px;
    padding: 8px; cursor: pointer; text-align: center;
    transition: all 0.15s;
    display: flex; flex-direction: column;
  }
  .rom-card:hover { background: #1f1f1f; border-color: #444; }
  .rom-card:active { transform: scale(0.98); }
  .rom-card .cover {
    width: 100%; aspect-ratio: 3 / 4;
    background: #0a0a0a; border-radius: 6px;
    overflow: hidden; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .rom-card .cover img {
    width: 100%; height: 100%; object-fit: cover;
    background: #0a0a0a;
  }
  .rom-card .cover .fallback {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 42px; color: #666;
  }
  .rom-card .cover img.loaded + .fallback { display: none; }
  .rom-card .title {
    font-size: 12px; word-break: break-word; flex: 1;
    line-height: 1.3;
  }
  .rom-card .badge {
    display: inline-block; padding: 2px 6px; background: #2a2a2a; border-radius: 4px;
    font-size: 10px; color: #aaa; margin-top: 6px; text-transform: uppercase;
    align-self: center;
  }
  .empty {
    grid-column: 1 / -1;
    color: #888; text-align: center; padding: 40px 16px; font-size: 14px;
  }
  .empty.error { color: #ff6b6b; }
  .btn-small {
    background: #2a2a2a; border: 1px solid #3a3a3a; color: #eee;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .btn-small:hover { background: #3a3a3a; }

  /* ===== Game ===== */
  #screen-game { padding: 0; }
  #game-container { width: 100%; height: 100%; background: #000; position: relative; }
  #game { width: 100%; height: 100%; }

  /* Loading overlay */
  .game-loading {
    position: absolute; inset: 0; background: #000;
    display: flex; align-items: center; justify-content: center;
    z-index: 9999; transition: opacity 0.4s;
  }
  .game-loading.hidden { opacity: 0; pointer-events: none; }
  .loading-content { text-align: center; }
  .loading-spinner {
    width: 48px; height: 48px;
    border: 3px solid #2a2a2a;
    border-top-color: #4070d0;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-game-name { color: #888; font-size: 13px; margin-top: 8px; }

  .game-menu {
    position: fixed; top: 8px; left: 8px; z-index: 99999;
  }
  .menu-toggle {
    width: 40px; height: 40px;
    background: rgba(0,0,0,0.55);
    border: 1px solid #555; color: #fff;
    border-radius: 8px; font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(6px);
    transition: background 0.15s;
  }
  .menu-toggle:hover { background: rgba(40,40,40,0.85); }
  .menu-toggle.open { background: rgba(60,60,60,0.95); }
  .menu-items {
    display: none;
    flex-direction: column;
    margin-top: 6px;
    gap: 4px;
    min-width: 160px;
  }
  .menu-items.open { display: flex; }
  .menu-item {
    background: rgba(0,0,0,0.85);
    border: 1px solid #555; color: #fff;
    padding: 10px 14px; border-radius: 6px;
    font-size: 13px; cursor: pointer;
    text-align: left;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .menu-item:hover { background: rgba(50,50,50,0.95); }
  .menu-item:active { transform: scale(0.97); }

  /* ===== Save Slots Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: flex; align-items: center; justify-content: center;
    z-index: 999999; padding: 16px;
    animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #161616; border: 1px solid #2a2a2a; border-radius: 14px;
    padding: 20px; width: 100%; max-width: 340px;
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
  .slot-list { display: flex; flex-direction: column; gap: 8px; }
  .slot {
    background: #0a0a0a; border: 1px solid #2a2a2a; border-radius: 8px;
    padding: 12px; display: flex; align-items: center; gap: 10px;
  }
  .slot-num { font-size: 13px; color: #888; min-width: 20px; font-weight: 500; }
  .slot-info { flex: 1; }
  .slot-info .slot-date { font-size: 12px; color: #eee; }
  .slot-info .slot-empty { font-size: 12px; color: #555; }
  .slot-actions { display: flex; gap: 6px; }
  .slot-btn {
    background: #2a2a2a; border: 1px solid #3a3a3a; color: #eee;
    padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer;
  }
  .slot-btn:hover { background: #3a3a3a; }
  .slot-btn.save { color: #4caf50; border-color: #2a5c2a; }
  .slot-btn.load { color: #4070d0; border-color: #2a3c6a; }
  .slot-btn.del  { color: #ff6b6b; border-color: #6a2a2a; }
  .modal-footer { margin-top: 16px; text-align: right; }
  .btn-cancel {
    background: #2a2a2a; border: 1px solid #3a3a3a; color: #aaa;
    padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  .btn-cancel:hover { background: #3a3a3a; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.9); border: 1px solid #4caf50; color: #4caf50;
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 99999;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: #ff6b6b; color: #ff6b6b; }

  .ejs_menu_bar, .ejs_menu_bar_hidden, .ejs_menu_button,
  .ejs_settings_parent, .ejs_cheat_parent, .ejs_netplay_parent,
  .ejs_save_states_menu, .ejs_context_menu, .ejs_popout_container,
  .ejs_loading_text {
    display: none !important;
  }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

  <!-- ===== REGISTER SCREEN ===== -->
  <div id="screen-register" class="screen active">
    <div class="register-card">
      <h1>Arcade</h1>
      <div class="subtitle">Ingresá tu nombre y email para jugar</div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="reg-name" placeholder="Tu nombre" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="email@ejemplo.com" autocomplete="email" inputmode="email">
      </div>
      <button class="btn-primary" id="reg-submit">Jugar</button>
      <div class="msg" id="reg-msg"></div>
    </div>
  </div>

  <!-- ===== ROM PICKER SCREEN ===== -->
  <div id="screen-picker" class="screen">
    <div class="picker-header">
      <h2>Elegí un juego</h2>
      <div class="user-info">
        <span class="hello" id="hello-user"></span>
        <button class="btn-small" id="logout-btn">Salir</button>
      </div>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="rom-search" placeholder="Buscar juego…" autocomplete="off">
    </div>
    <div class="grid" id="rom-grid">
      <div class="empty">Cargando lista…</div>
    </div>
  </div>

  <!-- ===== GAME SCREEN ===== -->
  <div id="screen-game" class="screen">
    <div id="game-container">
      <div class="game-loading" id="game-loading">
        <div class="loading-content">
          <div class="loading-spinner"></div>
          <div style="color:#eee;font-size:15px;">Iniciando emulador…</div>
          <div class="loading-game-name" id="loading-game-name"></div>
        </div>
      </div>
      <div class="game-menu">
        <button class="menu-toggle" id="menu-toggle" aria-label="Menú">☰</button>
        <div class="menu-items" id="menu-items">
          <button class="menu-item" id="save-btn">💾 Guardar partida</button>
          <button class="menu-item" id="load-btn">📂 Cargar partida</button>
          <button class="menu-item" id="back-btn">← Volver al menú</button>
        </div>
      </div>
      <div id="game"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  //=============================================================================
  // CONFIG
  //=============================================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_lXVeIGK-YZqkc4HXqy3xfBpOEESNn4GteThwXVnO9b3L9B9FhJqgzaxcFfPXQTCi/exec';

  const ROMS_FOLDER = 'roms';
  const AUTO_SAVE_INTERVAL_MS = 30000;
  const NUM_SLOTS = 3;
  const STORE = {
    SESSION:     'arcade_session_v2',
    SAVES:       'arcade_saves_v2',
    CURRENT_ROM: 'arcade_current_rom_v1'
  };

  //=============================================================================
  // STORAGE UTILS
  //=============================================================================
  function loadStore(key, fallback, useSession) {
    try {
      const v = (useSession ? sessionStorage : localStorage).getItem(key);
      return v ? JSON.parse(v) : fallback;
    } catch { return fallback; }
  }
  function saveStore(key, value, useSession) {
    (useSession ? sessionStorage : localStorage).setItem(key, JSON.stringify(value));
  }
  function delStore(key, useSession) {
    (useSession ? sessionStorage : localStorage).removeItem(key);
  }

  //=============================================================================
  // BINARY UTILS
  //=============================================================================
  function uint8ToBase64(u8) {
    if (!u8 || u8.length === 0) return '';
    let s = '';
    const chunk = 0x8000;
    for (let i = 0; i < u8.length; i += chunk) {
      s += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + chunk, u8.length)));
    }
    return btoa(s);
  }
  function base64ToUint8(b64) {
    if (!b64) return new Uint8Array(0);
    const s = atob(b64);
    const u8 = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i);
    return u8;
  }

  //=============================================================================
  // UI HELPERS
  //=============================================================================
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
    const target = document.getElementById('screen-' + name);
    if (target) target.classList.add('active');
  }
  function setRegMsg(text, type) {
    const m = document.getElementById('reg-msg');
    m.textContent = text;
    m.className = 'msg ' + (type || '');
  }
  let toastTimer = null;
  function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'error' ? ' error' : '');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = 'toast'; }, 1800);
  }

  //=============================================================================
  // REGISTRO
  //=============================================================================
  let currentUser = null;

  document.getElementById('reg-submit').addEventListener('click', handleRegister);
  ['reg-name', 'reg-email'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') handleRegister();
    });
  });

  async function handleRegister() {
    const name  = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim().toLowerCase();

    if (!name)  { setRegMsg('Ingresá tu nombre', 'error'); return; }
    if (!email) { setRegMsg('Ingresá tu email', 'error'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      setRegMsg('Email inválido', 'error'); return;
    }

    const btn = document.getElementById('reg-submit');
    btn.disabled = true;
    btn.textContent = 'Guardando…';
    setRegMsg('', '');

    try { submitToGoogleSheet(name, email); } catch(_) {}

    const user = { name, email, synced: true };
    saveStore(STORE.SESSION, user);
    enterApp(user);

    btn.disabled = false;
    btn.textContent = 'Jugar';
  }

  function submitToGoogleSheet(name, email) {
    const url = APPS_SCRIPT_URL + '?' + new URLSearchParams({ name, email });
    fetch(url, { method: 'GET', mode: 'no-cors' }).catch(() => {});
  }

  document.getElementById('logout-btn').addEventListener('click', () => {
    if (!confirm('¿Salir?')) return;
    delStore(STORE.SESSION);
    delStore(STORE.CURRENT_ROM, true);
    location.reload();
  });

  //=============================================================================
  // ROM LIST
  //=============================================================================
  async function loadROMList() {
    const grid = document.getElementById('rom-grid');
    grid.innerHTML = '<div class="empty">Cargando lista…</div>';

    let roms = await detectROMsViaGitHubAPI();

    if (!roms) {
      try {
        const r = await fetch(ROMS_FOLDER + '/manifest.json', { cache: 'no-store' });
        if (r.ok) {
          const arr = await r.json();
          roms = arr.map(name => ({ name, path: ROMS_FOLDER + '/' + name }));
        }
      } catch (_) {}
    }

    if (!roms || roms.length === 0) {
      grid.innerHTML = '<div class="empty error">No se encontraron ROMs en la carpeta /' + ROMS_FOLDER + '/. ' +
                       'Subí archivos .gb o .gbc al repo.</div>';
      return;
    }

    roms.sort((a, b) => a.name.localeCompare(b.name));
    let manualCovers = {};
    try {
      const r = await fetch(ROMS_FOLDER + '/covers.json', { cache: 'no-store' });
      if (r.ok) manualCovers = await r.json();
    } catch (_) {}

    grid.innerHTML = '';
    roms.forEach(rom => {
      const card = document.createElement('div');
      card.className = 'rom-card';
      const isGBC = /\.gbc$/i.test(rom.name);
      const title = rom.name.replace(/\.(gb|gbc)$/i, '').replace(/[-_]/g, ' ');
      const fallbackIcon = isGBC ? '🎨' : '🎮';
      card.innerHTML =
        '<div class="cover">' +
          '<img alt="" loading="lazy">' +
          '<div class="fallback">' + fallbackIcon + '</div>' +
        '</div>' +
        '<div class="title">' + escapeHTML(title) + '</div>' +
        '<div class="badge">' + (isGBC ? 'GBC' : 'GB') + '</div>';
      card.addEventListener('click', () => selectROM(rom));
      grid.appendChild(card);

      const img = card.querySelector('img');
      tryLoadCover(img, rom, manualCovers[rom.name]);
    });

    document.getElementById('rom-search').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.rom-card').forEach(card => {
        const title = card.querySelector('.title').textContent.toLowerCase();
        card.style.display = (!q || title.includes(q)) ? '' : 'none';
      });
    });
  }

  function tryLoadCover(img, rom, manualUrl) {
    const candidates = buildCoverCandidates(rom, manualUrl);
    let idx = 0;
    img.onload = () => { img.classList.add('loaded'); };
    img.onerror = () => {
      idx++;
      if (idx < candidates.length) {
        img.src = candidates[idx];
      } else {
        img.style.display = 'none';
        img.onerror = null;
      }
    };
    img.src = candidates[0];
  }

  function buildCoverCandidates(rom, manualUrl) {
    const list = [];
    if (manualUrl) list.push(manualUrl);

    const base = rom.name.replace(/\.(gb|gbc)$/i, '').trim();
    const isGBC = /\.gbc$/i.test(rom.name);
    const folders = isGBC
      ? ['Nintendo_-_Game_Boy_Color', 'Nintendo_-_Game_Boy']
      : ['Nintendo_-_Game_Boy', 'Nintendo_-_Game_Boy_Color'];

    const variants = [];
    const add = (s) => {
      const t = (s || '').trim().replace(/\s+/g, ' ');
      if (t && variants.indexOf(t) === -1) variants.push(t);
    };

    add(base);
    let stripped = base;
    while (/\s*\([^)]*\)\s*$/.test(stripped)) {
      stripped = stripped.replace(/\s*\([^)]*\)\s*$/, '').trim();
      add(stripped);
    }
    const coreName = stripped;

    if (coreName) {
      ['(World)', '(USA, Europe)', '(USA)', '(Europe)', '(Japan)',
       '(USA, Europe, Korea)', '(World) (Rev 1)', '(USA, Europe) (Rev 1)']
        .forEach(tag => add(coreName + ' ' + tag));
    }

    if (/Pokemon/i.test(base)) {
      variants.slice().forEach(v => add(v.replace(/Pokemon/g, 'Pokémon')));
    }

    variants.slice().forEach(v => {
      if (/\bII\b/.test(v)) add(v.replace(/\bII\b/g, '2'));
      if (/\b2\b/.test(v))  add(v.replace(/\b2\b/g, 'II'));
    });

    for (const folder of folders) {
      for (const v of variants) {
        list.push(
          'https://raw.githubusercontent.com/libretro-thumbnails/' + folder +
          '/master/Named_Boxarts/' + encodeURIComponent(v) + '.png'
        );
      }
    }
    return list;
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function detectROMsViaGitHubAPI() {
    const host = window.location.hostname;
    if (!host.endsWith('.github.io')) return null;

    const owner = host.split('.')[0];
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const repo = pathParts[0] || (owner + '.github.io');

    try {
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${ROMS_FOLDER}`;
      const r = await fetch(url);
      if (!r.ok) return null;
      const files = await r.json();
      if (!Array.isArray(files)) return null;
      return files
        .filter(f => f.type === 'file' && /\.(gb|gbc)$/i.test(f.name))
        .map(f => ({ name: f.name, path: ROMS_FOLDER + '/' + f.name }));
    } catch (e) {
      console.warn('GitHub API listing failed:', e);
      return null;
    }
  }

  function selectROM(rom) {
    saveStore(STORE.CURRENT_ROM, rom, true);
    location.reload();
  }

  //=============================================================================
  // EMULATOR
  //=============================================================================
  let currentROM = null;
  let autoSaveTimer = null;
  let emulatorReady = false;

  function bootEmulator(rom) {
    currentROM = rom;
    showScreen('game');
    document.getElementById('loading-game-name').textContent =
      rom.name.replace(/\.(gb|gbc)$/i, '').replace(/[-_]/g, ' ');

    window.EJS_player     = '#game';
    window.EJS_gameUrl    = rom.path;
    window.EJS_core       = 'gb';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    window.EJS_volume     = 0.6;
    window.EJS_disableDatabases = true;
    window.EJS_Buttons = {
      playPause: false, restart: false, mute: false, settings: false,
      fullscreen: true, saveState: false, loadState: false,
      screenRecord: false, gamepad: false, cheat: false, volume: false,
      saveSavFiles: false, loadSavFiles: false, quickSave: false,
      quickLoad: false, screenshot: false, cacheManager: false, exitEmulation: false
    };

    const slot0 = getSaveSlot(0);
    if (slot0 && slot0.state) {
      window.EJS_loadStateURL = 'data:application/octet-stream;base64,' + slot0.state;
    }

    window.EJS_ready = function () {
      emulatorReady = true;
      const overlay = document.getElementById('game-loading');
      overlay.classList.add('hidden');
      setTimeout(() => { overlay.style.display = 'none'; }, 400);
      if (autoSaveTimer) clearInterval(autoSaveTimer);
      autoSaveTimer = setInterval(() => saveToSlot(0, true), AUTO_SAVE_INTERVAL_MS);
    };

    const sc = document.createElement('script');
    sc.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
    document.body.appendChild(sc);
  }

  //=============================================================================
  // SAVE SLOTS
  //=============================================================================
  function getSlotKey() {
    return currentUser.email + '|' + currentROM.name;
  }
  function getAllSlots() {
    const saves = loadStore(STORE.SAVES, {});
    const slots = saves[getSlotKey()] || [];
    while (slots.length < NUM_SLOTS) slots.push(null);
    return slots;
  }
  function persistSlots(slots) {
    const saves = loadStore(STORE.SAVES, {});
    saves[getSlotKey()] = slots;
    saveStore(STORE.SAVES, saves);
  }
  function getSaveSlot(idx) {
    return getAllSlots()[idx] || null;
  }

  function getEmulatorState() {
    const e = window.EJS_emulator;
    if (!e) return null;
    try {
      if (e.gameManager && typeof e.gameManager.getState === 'function') return e.gameManager.getState();
      if (typeof e.getState === 'function') return e.getState();
    } catch (err) { console.warn('getState error:', err); }
    return null;
  }
  function getEmulatorSRAM() {
    const e = window.EJS_emulator;
    if (!e) return null;
    try {
      if (e.gameManager && typeof e.gameManager.getSaveFile === 'function') return e.gameManager.getSaveFile();
    } catch (err) { console.warn('getSaveFile error:', err); }
    return null;
  }

  function saveToSlot(idx, silent) {
    if (!emulatorReady || !currentUser || !currentROM) return false;
    try {
      const state = getEmulatorState();
      const sram  = getEmulatorSRAM();
      if (!state) return false;
      const slots = getAllSlots();
      slots[idx] = {
        state: uint8ToBase64(state),
        sram:  sram ? uint8ToBase64(sram) : '',
        t:     Date.now()
      };
      persistSlots(slots);
      if (!silent) toast('Slot ' + (idx + 1) + ' guardado ✓');
      return true;
    } catch (e) {
      console.warn('save failed:', e);
      if (!silent) toast('Error al guardar', 'error');
      return false;
    }
  }

  function loadFromSlot(idx) {
    if (!emulatorReady || !currentUser || !currentROM) {
      toast('El juego todavía no está listo', 'error'); return;
    }
    const slot = getSaveSlot(idx);
    if (!slot || !slot.state) {
      toast('Slot ' + (idx + 1) + ' vacío', 'error'); return;
    }
    try {
      const stateBytes = base64ToUint8(slot.state);
      const e = window.EJS_emulator;
      let ok = false;
      if (e && e.gameManager && typeof e.gameManager.loadState === 'function') {
        e.gameManager.loadState(stateBytes); ok = true;
      } else if (e && typeof e.loadState === 'function') {
        e.loadState(stateBytes); ok = true;
      }
      if (ok) toast('Slot ' + (idx + 1) + ' cargado (' + new Date(slot.t).toLocaleString() + ') ✓');
      else toast('No se pudo cargar (API del emulador)', 'error');
    } catch (err) {
      console.warn('loadState error:', err);
      toast('Error al cargar', 'error');
    }
  }

  function deleteSlot(idx) {
    if (!confirm('¿Borrar slot ' + (idx + 1) + '?')) return;
    const slots = getAllSlots();
    slots[idx] = null;
    persistSlots(slots);
    toast('Slot ' + (idx + 1) + ' borrado');
    openSlotsModal(currentModalMode);
  }

  //=============================================================================
  // SLOTS MODAL
  //=============================================================================
  let currentModalMode = 'save';

  function openSlotsModal(mode) {
    currentModalMode = mode;
    closeMenu();
    const existing = document.getElementById('slots-modal');
    if (existing) existing.remove();

    const slots = getAllSlots();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.id = 'slots-modal';

    let slotsHTML = '';
    for (let i = 0; i < NUM_SLOTS; i++) {
      const s = slots[i];
      const info = s
        ? '<span class="slot-date">' + new Date(s.t).toLocaleString() + '</span>'
        : '<span class="slot-empty">Vacío</span>';
      const saveBtn = '<button class="slot-btn save" data-idx="' + i + '" data-action="save">Guardar</button>';
      const loadBtn = s ? '<button class="slot-btn load" data-idx="' + i + '" data-action="load">Cargar</button>' : '';
      const delBtn  = s ? '<button class="slot-btn del"  data-idx="' + i + '" data-action="del">✕</button>' : '';
      slotsHTML += '<div class="slot">' +
        '<div class="slot-num">' + (i + 1) + '</div>' +
        '<div class="slot-info">' + info + '</div>' +
        '<div class="slot-actions">' + saveBtn + loadBtn + delBtn + '</div>' +
        '</div>';
    }

    overlay.innerHTML = '<div class="modal">' +
      '<h3>💾 Slots de guardado</h3>' +
      '<div class="slot-list">' + slotsHTML + '</div>' +
      '<div class="modal-footer"><button class="btn-cancel" id="modal-cancel">Cerrar</button></div>' +
      '</div>';

    overlay.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) { if (e.target === overlay) overlay.remove(); return; }
      const idx = parseInt(btn.dataset.idx);
      const action = btn.dataset.action;
      if (action === 'save') { saveToSlot(idx, false); openSlotsModal(mode); }
      if (action === 'load') { loadFromSlot(idx); overlay.remove(); }
      if (action === 'del')  { deleteSlot(idx); }
    });
    overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  //=============================================================================
  // MENU
  //=============================================================================
  const menuToggle = document.getElementById('menu-toggle');
  const menuItems  = document.getElementById('menu-items');
  function closeMenu() {
    menuItems.classList.remove('open');
    menuToggle.classList.remove('open');
  }
  menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    menuItems.classList.toggle('open');
    menuToggle.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.game-menu') && !e.target.closest('.modal-overlay')) closeMenu();
  });
  document.addEventListener('touchstart', (e) => {
    if (!e.target.closest('.game-menu') && !e.target.closest('.modal-overlay')) closeMenu();
  }, { passive: true });

  document.getElementById('save-btn').addEventListener('click', () => openSlotsModal('save'));
  document.getElementById('load-btn').addEventListener('click', () => openSlotsModal('load'));
  document.getElementById('back-btn').addEventListener('click', () => {
    saveToSlot(0, true);
    delStore(STORE.CURRENT_ROM, true);
    location.reload();
  });

  //=============================================================================
  // KIOSK SHORTCUTS BLOCKER
  //=============================================================================
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey) {
      const k = (e.key || '').toLowerCase();
      if (['s','p','u','o','j','w','t','n','r','d','h'].indexOf(k) !== -1) e.preventDefault();
    }
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop',     e => e.preventDefault());
  document.addEventListener('gesturestart', e => e.preventDefault());

  //=============================================================================
  // ENTRY POINT
  //=============================================================================
  function enterApp(user) {
    currentUser = user;
    document.getElementById('hello-user').textContent = 'Hola, ' + user.name;

    const rom = loadStore(STORE.CURRENT_ROM, null, true);
    if (rom && rom.name && rom.path) {
      bootEmulator(rom);
    } else {
      showScreen('picker');
      loadROMList();
    }
  }

  window.addEventListener('beforeunload', () => {
    if (currentROM && emulatorReady) saveToSlot(0, true);
  });
  window.addEventListener('pagehide', () => {
    if (currentROM && emulatorReady) saveToSlot(0, true);
  });

  (function init() {
    const session = loadStore(STORE.SESSION, null);
    if (session && session.email && session.name) {
      if (!session.synced) {
        try { submitToGoogleSheet(session.name, session.email); } catch(_) {}
        session.synced = true;
        saveStore(STORE.SESSION, session);
      }
      enterApp(session);
      return;
    }
    showScreen('register');
  })();
  </script>
</body>
</html>
