<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Arcadia — Retro Gaming</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<!-- GA4: función base siempre disponible; el script de medición se carga dinámicamente si GA4_ID está configurado -->
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());</script>
<style>
  :root {
    --bg:        #08000f;
    --surface:   #120825;
    --surface2:  #1e1038;
    --border:    #3a1868;
    --accent:    #7b3fc8;
    --accent-hi: #a55ef0;
    --btn-a:     #c0244a;
    --btn-a-sh:  #7a0028;
    --btn-b:     #2a1050;
    --btn-b-sh:  #0e0030;
    --text:      #f0e5ff;
    --muted:     #9070b8;
    --red:       #ff5f6d;
    --green:     #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  body { touch-action: none; }
  .screen { display: none; width: 100vw; height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ===== Landing / Register ===== */
  #screen-register { position: relative; align-items: center; justify-content: center; padding: 20px; overflow: hidden; }
  .landing-bg {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(ellipse at 25% 15%, rgba(123,63,200,0.22) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 85%, rgba(165,94,240,0.15) 0%, transparent 55%),
      radial-gradient(circle, rgba(165,94,240,0.18) 1px, transparent 1px);
    background-size: auto, auto, 36px 36px;
  }
  .scanlines {
    position: absolute; inset: 0; pointer-events: none; z-index: 1;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px);
  }
  .pixel-deco { position: absolute; pointer-events: none; opacity: 0.45; filter: drop-shadow(0 0 8px rgba(165,94,240,0.7)); }
  @keyframes floatA { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-14px) rotate(6deg)} }
  @keyframes floatB { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-9px) rotate(-4deg)} }
  @keyframes arcadeGlow {
    0%,100% { text-shadow: 0 0 18px #a55ef0, 0 0 40px rgba(165,94,240,0.55), 0 0 90px rgba(165,94,240,0.25); }
    50%      { text-shadow: 0 0 28px #d8b4fe, 0 0 60px rgba(192,132,252,0.75), 0 0 110px rgba(165,94,240,0.4); }
  }
  .landing-content {
    position: relative; z-index: 2; display: flex; flex-direction: column;
    align-items: center; width: 100%; max-width: 420px; text-align: center;
  }
  .landing-tag {
    font-size: 11px; letter-spacing: 5px; color: var(--accent-hi);
    text-transform: uppercase; font-weight: 700; margin-bottom: 10px; opacity: 0.9;
  }
  .landing-title {
    font-size: clamp(58px, 18vw, 108px); font-weight: 900; letter-spacing: 10px;
    margin: 0 0 4px; line-height: 1; color: #f4ecff;
    animation: arcadeGlow 3s ease-in-out infinite;
  }
  .landing-consoles { font-size: 20px; letter-spacing: 10px; margin: 10px 0 4px; opacity: 0.6; }
  .landing-sub { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; margin: 0 0 30px; line-height: 1.8; text-transform: uppercase; }
  .landing-divider { width: 80px; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 0 auto 28px; }
  .landing-buttons { width: 100%; max-width: 300px; }
  .btn-google {
    width: 100%; padding: 15px 20px; border-radius: 12px; border: none;
    background: #fff; color: #1f1f1f; font-size: 16px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.45); transition: box-shadow 0.15s, transform 0.1s;
  }
  .btn-google:hover  { box-shadow: 0 8px 35px rgba(0,0,0,0.55); transform: translateY(-2px); }
  .btn-google:active { transform: translateY(0); box-shadow: 0 3px 12px rgba(0,0,0,0.3); }
  .btn-google:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-guest {
    width: 100%; padding: 11px; background: transparent;
    border: 1px solid rgba(165,94,240,0.35); color: var(--muted);
    border-radius: 10px; font-size: 13px; cursor: pointer; margin-top: 10px;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .btn-guest:hover { border-color: var(--accent); color: var(--text); background: rgba(123,63,200,0.08); }
  .btn-primary {
    width: 100%; padding: 14px; background: var(--btn-a);
    box-shadow: 0 5px 0 var(--btn-a-sh); border: none; border-radius: 50px;
    color: #fff; font-size: 15px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer; margin-top: 8px;
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn-primary:hover { background: #d42e56; }
  .btn-primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--btn-a-sh); }
  .btn-primary:disabled { background: var(--border); box-shadow: none; color: var(--muted); cursor: not-allowed; }
  .msg { margin-top: 12px; font-size: 13px; min-height: 18px; text-align: center; }
  .msg.error { color: var(--red); }
  .msg.ok    { color: var(--green); }

  /* ===== Console Picker ===== */
  #screen-consoles { padding: 16px; }
  .console-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 12px; overflow-y: auto; flex: 1; padding-bottom: 16px;
  }
  .console-card {
    background: var(--surface); border: 2px solid var(--border);
    border-radius: 18px; padding: 24px 10px 18px;
    cursor: pointer; text-align: center;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .console-card:hover  { background: var(--surface2); }
  .console-card:active { transform: scale(0.95); }
  .console-emoji { font-size: 46px; line-height: 1; margin-bottom: 2px; }
  .console-name { font-size: 14px; font-weight: 700; }
  .console-sub  { font-size: 10px; color: var(--muted); }

  /* ===== ROM Picker ===== */
  #screen-picker { padding: 16px; }
  .picker-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px; flex-shrink: 0;
  }
  .picker-header h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .picker-header .user-info { display: flex; align-items: center; gap: 8px; }
  .picker-header .hello { color: var(--muted); font-size: 13px; }
  .search-bar { position: relative; margin-bottom: 12px; flex-shrink: 0; }
  .search-bar input {
    width: 100%; padding: 10px 14px 10px 38px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 50px;
    color: var(--text); font-size: 14px;
    -webkit-user-select: text; user-select: text;
  }
  .search-bar input:focus { outline: none; border-color: var(--accent); }
  .search-bar input::placeholder { color: var(--muted); }
  .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px; overflow-y: auto; flex: 1; padding-bottom: 16px;
  }
  .rom-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px; cursor: pointer; text-align: center;
    transition: all 0.15s; display: flex; flex-direction: column;
  }
  .rom-card:hover { background: var(--surface2); border-color: var(--accent); box-shadow: 0 0 14px rgba(123,63,200,0.2); }
  .rom-card:active { transform: scale(0.97); }
  .rom-card .cover {
    width: 100%; aspect-ratio: 3 / 4; background: var(--bg); border-radius: 8px;
    overflow: hidden; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .rom-card .cover img { width: 100%; height: 100%; object-fit: cover; }
  .rom-card .cover .fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 42px; color: var(--muted); }
  .rom-card .cover img.loaded + .fallback { display: none; }
  .rom-card .title { font-size: 12px; word-break: break-word; flex: 1; line-height: 1.3; }
  .rom-card .badge {
    display: inline-block; padding: 2px 7px; background: var(--border); border-radius: 50px;
    font-size: 10px; color: var(--accent-hi); margin-top: 6px; text-transform: uppercase;
    align-self: center; letter-spacing: 0.5px;
  }
  .empty { grid-column: 1 / -1; color: var(--muted); text-align: center; padding: 40px 16px; font-size: 14px; }
  .empty.error { color: var(--red); }
  .btn-small {
    background: var(--btn-b); box-shadow: 0 3px 0 var(--btn-b-sh);
    border: 1px solid var(--border); color: var(--text);
    padding: 6px 14px; border-radius: 50px; font-size: 11px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
    transition: transform 0.08s, box-shadow 0.08s; white-space: nowrap;
  }
  .btn-small:hover { background: #3a1870; }
  .btn-small:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-b-sh); }

  /* ===== Global Banner — siempre visible ===== */
  .game-banner {
    position: fixed; top: 0; left: 0; right: 0; height: 58px;
    background: linear-gradient(90deg, #1a0840 0%, #35116a 50%, #1a0840 100%);
    border-bottom: 2px solid rgba(165,94,240,0.5);
    box-shadow: 0 2px 12px rgba(123,63,200,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 10000; overflow: hidden;
    transition: height 0.35s ease, opacity 0.35s ease, border-color 0.35s;
  }
  .banner-ad { display: flex; align-items: center; justify-content: center; flex: 1; height: 100%; overflow: hidden; }
  .noads-btn {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none;
    color: rgba(255,255,255,0.2); padding: 2px 6px;
    font-size: 9px; font-weight: 600; letter-spacing: 0.5px;
    text-transform: uppercase; cursor: pointer; transition: color 0.15s; white-space: nowrap;
  }
  .noads-btn:hover { color: rgba(255,255,255,0.55); }

  /* Offset de banner en todas las pantallas no-game */
  #screen-register { padding-top: calc(58px + 16px) !important; }
  #screen-consoles  { padding-top: calc(58px + 16px) !important; }
  #screen-picker    { padding-top: calc(58px + 16px) !important; }

  /* No-ads: colapsar banner y ajustar offsets */
  .game-banner.no-ads { height: 0; opacity: 0; pointer-events: none; border-color: transparent; }
  body.no-ads #screen-register,
  body.no-ads #screen-consoles,
  body.no-ads #screen-picker,
  body.no-ads #screen-game { padding-top: 0 !important; }

  /* ===== Game Screen ===== */
  #screen-game { padding-top: 58px; padding-left: 0; padding-right: 0; padding-bottom: 0; }
  #game-container { width: 100%; flex: 1; min-height: 0; background: var(--bg); position: relative; }

  #game {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg);
  }
  .game-loading {
    position: absolute; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    z-index: 999; transition: opacity 0.4s;
  }
  .game-loading.hidden { opacity: 0; pointer-events: none; }
  .loading-content { text-align: center; }
  .loading-spinner {
    width: 48px; height: 48px; border: 3px solid var(--border);
    border-top-color: var(--accent-hi); border-radius: 50%;
    margin: 0 auto 16px; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-game-name { color: var(--muted); font-size: 13px; margin-top: 8px; }

  .game-menu {
    position: fixed; right: 16px;
    bottom: 20px;
    z-index: 99999;
  }
  .menu-toggle {
    padding: 7px 18px; background: var(--btn-b); box-shadow: 0 3px 0 var(--btn-b-sh);
    border: 1px solid rgba(123,63,200,0.5); color: rgba(240,229,255,0.8);
    border-radius: 50px; font-size: 10px; font-weight: 800;
    letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background 0.12s, color 0.12s;
  }
  .menu-toggle:hover { background: rgba(58,24,104,0.95); color: var(--text); }
  .menu-toggle.open { background: var(--accent); color: #fff; box-shadow: 0 1px 0 #4a1890; }
  .menu-items {
    display: none; flex-direction: column;
    position: absolute; right: 0; bottom: calc(100% + 10px);
    gap: 4px; min-width: 175px;
  }
  .menu-items.open { display: flex; }
  .menu-item {
    background: rgba(18,8,37,0.96); border: 1px solid var(--border); color: var(--text);
    padding: 10px 16px; border-radius: 50px; font-size: 13px; font-weight: 600;
    cursor: pointer; text-align: left; backdrop-filter: blur(8px); white-space: nowrap;
    transition: background 0.12s;
  }
  .menu-item:hover { background: rgba(58,24,104,0.95); border-color: var(--accent); }
  .menu-item:active { transform: scale(0.97); }

  /* ===== Modal ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(4,0,10,0.82);
    display: flex; align-items: center; justify-content: center;
    z-index: 999999; padding: 16px; animation: fadeIn 0.15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    padding: 22px; width: 100%; max-width: 360px;
    box-shadow: 0 0 40px rgba(123,63,200,0.25);
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { margin: 0 0 16px; font-size: 16px; font-weight: 700; }
  .slot-section { margin-bottom: 14px; }
  .slot-section-hdr {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px;
  }
  .tier-badge {
    padding: 2px 8px; border-radius: 50px; font-size: 9px; letter-spacing: 0.5px;
    background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
  }
  .tier-badge.premium { background: var(--accent); color: #fff; border-color: var(--accent); }
  .slot-list { display: flex; flex-direction: column; gap: 7px; }
  .slot {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; display: flex; align-items: center; gap: 10px;
  }
  .slot-num { font-size: 13px; color: var(--muted); min-width: 18px; font-weight: 700; }
  .slot-info { flex: 1; }
  .slot-info .slot-date  { font-size: 11px; color: var(--text); }
  .slot-info .slot-empty { font-size: 11px; color: var(--muted); }
  .slot-actions { display: flex; gap: 5px; }
  .slot-btn {
    border: 1px solid var(--border); color: var(--text);
    padding: 4px 9px; border-radius: 50px; font-size: 10px;
    font-weight: 600; cursor: pointer; background: var(--surface2);
    transition: transform 0.08s;
  }
  .slot-btn:active { transform: scale(0.95); }
  .slot-btn.save { color: var(--green); border-color: #1a5c2a; background: #0a1f0e; }
  .slot-btn.load { color: var(--accent-hi); border-color: var(--border); }
  .slot-btn.del  { color: var(--red); border-color: #6a1a1a; background: #1a0808; }
  .cloud-msg { color: var(--muted); font-size: 13px; text-align: center; padding: 14px; border: 1px solid var(--border); border-radius: 8px; }
  .cloud-msg.error { color: var(--red); border-color: #6a1a1a; }
  .premium-cta {
    background: linear-gradient(135deg, var(--surface), #2a1050);
    border: 1px solid var(--accent); border-radius: 12px; padding: 18px; text-align: center;
  }
  .premium-cta-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .premium-cta-desc  { font-size: 12px; color: var(--muted); }
  .premium-price { font-size: 28px; font-weight: 800; color: var(--accent-hi); margin: 10px 0 4px; }
  .premium-price span { font-size: 14px; color: var(--muted); font-weight: 400; }
  .btn-mp {
    display: inline-block; padding: 11px 24px; background: #009EE3; color: #fff;
    border-radius: 50px; font-size: 13px; font-weight: 700; text-decoration: none;
    margin: 10px 0 6px; transition: background 0.15s;
  }
  .btn-mp:hover { background: #00b4ff; }
  .btn-mp-disabled {
    display: inline-block; padding: 11px 24px; background: var(--surface2);
    color: var(--muted); border-radius: 50px; font-size: 13px; font-weight: 600;
    margin: 10px 0 6px; border: 1px dashed var(--border);
  }
  .premium-note { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .verify-btn {
    display: block; width: 100%; margin-top: 10px; background: transparent;
    border: 1px solid var(--border); color: var(--muted); padding: 8px; border-radius: 50px;
    font-size: 11px; cursor: pointer; transition: color 0.15s, border-color 0.15s;
  }
  .verify-btn:hover { color: var(--text); border-color: var(--accent); }
  .modal-footer { margin-top: 16px; text-align: right; }
  .btn-cancel {
    background: var(--btn-b); box-shadow: 0 3px 0 var(--btn-b-sh);
    border: 1px solid var(--border); color: var(--muted);
    padding: 8px 20px; border-radius: 50px; font-size: 13px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    cursor: pointer; transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn-cancel:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-b-sh); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: rgba(8,0,15,0.95); border: 1px solid var(--green); color: var(--green);
    padding: 10px 18px; border-radius: 50px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999999;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); color: var(--red); }

  /* Ocultar solo los paneles del menú de EmulatorJS — NO el botón de inicio ni el canvas */
  .ejs_menu_bar, .ejs_menu_bar_hidden,
  .ejs_settings_parent, .ejs_cheat_parent,
  .ejs_save_states_menu, .ejs_context_menu,
  .ejs_popout_container, .ejs_loading_text,
  [class*="ejs_menu"] {
    display: none !important; visibility: hidden !important; pointer-events: none !important;
  }

  /* ===== Mobile en juego: banner pasa al fondo, MENÚ arriba a la derecha ===== */
  @media (max-width: 767px) {
    body.in-game .game-banner {
      top: auto !important;
      bottom: 0;
      border-bottom: none;
      border-top: 2px solid rgba(165,94,240,0.5);
      box-shadow: 0 -2px 12px rgba(123,63,200,0.3);
    }
    body.in-game #screen-game {
      padding-top: 0 !important;
      padding-bottom: 58px !important;
    }
    /* MENÚ: ícono pequeño arriba a la derecha */
    body.in-game .game-menu {
      top: 6px;
      bottom: auto !important;
      right: 6px;
    }
    body.in-game .menu-toggle {
      padding: 7px 9px;
      font-size: 9px;
      letter-spacing: 0;
    }
    /* Texto "MENÚ" oculto, solo el ícono */
    body.in-game .menu-word { display: none; }
    /* Menú se abre hacia abajo porque el botón está arriba */
    body.in-game .menu-items {
      bottom: auto;
      top: calc(100% + 8px);
    }
  }
  /* Botón "Quitar publicidad" en el menú del juego */
  .menu-item-noads {
    background: linear-gradient(135deg, rgba(180,130,0,0.28), rgba(240,180,0,0.15));
    border-color: rgba(240,180,0,0.45) !important;
    color: #fcd34d !important;
    font-weight: 700;
  }
  .menu-item-noads:hover { background: linear-gradient(135deg, rgba(180,130,0,0.45), rgba(240,180,0,0.3)) !important; }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false">

  <!-- BANNER GLOBAL -->
  <div class="game-banner" id="game-banner">
    <div class="banner-ad" id="banner-ad-content"></div>
  </div>

  <!-- REGISTER / LANDING -->
  <div id="screen-register" class="screen active">
    <div class="landing-bg"></div>
    <div class="scanlines"></div>
    <!-- Píxeles flotantes decorativos -->
    <div class="pixel-deco" style="top:7%;left:6%;font-size:30px;animation:floatA 4.2s ease-in-out infinite">👾</div>
    <div class="pixel-deco" style="top:10%;right:7%;font-size:24px;animation:floatB 5.1s ease-in-out infinite 1s">🕹️</div>
    <div class="pixel-deco" style="top:72%;left:5%;font-size:22px;animation:floatA 6s ease-in-out infinite 2s">🎮</div>
    <div class="pixel-deco" style="top:68%;right:5%;font-size:26px;animation:floatB 4.8s ease-in-out infinite 0.5s">⭐</div>

  //=============================================================================

  //=============================================================================

  //=============================================================================
  // FIREBASE
  //=============================================================================
  let _auth = null, _db = null, _isPremium = null;

  function initFirebase() {
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      _auth = firebase.auth();
      _db   = firebase.firestore();
      _auth.onAuthStateChanged(async user => {
        if (!user || !_db) return;

        // Guardar / completar perfil del usuario en Firestore
        const profileRef = _db.doc('users/' + user.uid);
        try {
          const snap = await profileRef.get();
          if (!snap.exists) {
            // Primera vez — guardar nombre + email del registro local
            await profileRef.set({
              name:      currentUser?.name  || '',
              email:     user.email         || '',
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
              verified:  user.emailVerified || false
            });
          } else if (user.emailVerified && !snap.data().verified) {
            // El usuario verificó su email → actualizar bandera
            await profileRef.update({
              verified:   true,
              verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          }
        } catch(e) { console.warn('[FB] profile:', e); }
      });
    } catch(e) { console.warn('[FB] init:', e); }
  }

  function fbPassword(email) {
    // Determinista: mismo email → misma contraseña en cualquier dispositivo/sesión
    return btoa(email.toLowerCase() + ':arc@d3_arcade!').slice(0, 32);
  }

  async function firebaseSignIn(email) {
    if (!_auth) return;
    const pw = fbPassword(email);
    try {
      await _auth.signInWithEmailAndPassword(email, pw);
    } catch(e) {
      const needsCreate = ['auth/user-not-found','auth/invalid-credential',
        'auth/invalid-login-credentials','auth/wrong-password'].includes(e.code);
      if (needsCreate) {
        try { await _auth.createUserWithEmailAndPassword(email, pw); }
        catch(e2) {
          if (e2.code === 'auth/email-already-in-use') {
            console.warn('[FB] password mismatch for existing account:', email);
          } else { console.warn('[FB] create:', e2.code); }
        }
      } else { console.warn('[FB] sign-in error:', e.code); }
    }
  }

  async function checkPremium(forceRefresh) {
    if (!forceRefresh && _isPremium !== null) return _isPremium;
    if (!_db || !_auth?.currentUser) return false;
    try {
      const snap = await _db.doc('users/' + _auth.currentUser.uid).get();
      _isPremium = snap.exists && snap.data().premium === true;
    } catch { _isPremium = false; }
    return _isPremium;
  }

  //=============================================================================
  // EJS TOUCH BUTTONS — ocultar Slow, toggle Fast
  //=============================================================================
  let fastBtnEl = null;
  let fastBtnVisible = true;

  function findAndHideSlowBtn() {
    const gameEl = document.getElementById('game');
    if (!gameEl) return;
    gameEl.querySelectorAll('*').forEach(el => {
      if (el.children.length) return; // solo nodos hoja
      const t = el.textContent.trim().toLowerCase();
      if (t === 'slow') {
        const target = el.closest('button') || el.parentElement;
        if (target) target.style.display = 'none';
      }
      if (t === 'fast' && !fastBtnEl) {
        fastBtnEl = el.closest('button') || el.parentElement;
      }
    });
  }

  //=============================================================================
  // ANALYTICS
  //=============================================================================
  function trackEvent(tipo, extra) {
    const ev = {
      tipo,
      consola: currentConsole?.id   || null,
      juego:   currentROM?.name     || null,
      uid:     _auth?.currentUser?.uid || null,
      device:  /Mobi|Android/i.test(navigator.userAgent) ? 'mobile' : 'desktop',
      ...extra
    };
    // Firestore: guardar en colección events
    if (_db) {
      try {
        _db.collection('events').add({
          ...ev,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch(_) {}
    }
    // GA4: si está configurado
    if (typeof gtag === 'function' && GA4_ID) {
      gtag('event', tipo, { consola: ev.consola, juego: ev.juego, device: ev.device, ...extra });
    }
  }

  //=============================================================================
  // LOCAL SAVE — 1 ranura gratis
  //=============================================================================
  function localKey() { return currentUser.email + '|' + currentConsole.id + '|' + currentROM.name; }
  function getLocalSave() { const db = loadStore(STORE.LOCAL_SAVE,{}); return db[localKey()]||null; }
  function setLocalSave(data) { const db = loadStore(STORE.LOCAL_SAVE,{}); db[localKey()]=data; saveStore(STORE.LOCAL_SAVE,db); }

  //=============================================================================
  // CLOUD SAVES — 10 ranuras premium
  //=============================================================================
  function cloudRef() {
    const uid = _auth?.currentUser?.uid;
    if (!uid || !_db) return null;
    const key = (currentConsole.id + '_' + currentROM.name).replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,100);
    return _db.doc('saves/' + uid + '/roms/' + key);
  }

  async function loadCloudSlots() {
    const ref = cloudRef(); if (!ref) return Array(10).fill(null);
    const snap = await ref.get();
    const slots = snap.exists ? (snap.data().slots||[]) : [];
    while (slots.length < 10) slots.push(null);
    return slots;
  }
  async function saveCloudSlot(idx, data) {
    const ref = cloudRef(); if (!ref) throw new Error('Sin conexión Firebase');
    const slots = await loadCloudSlots(); slots[idx] = data; await ref.set({ slots });
  }
  async function deleteCloudSlot(idx) {
    const ref = cloudRef(); if (!ref) throw new Error('Sin conexión Firebase');
    const slots = await loadCloudSlots(); slots[idx] = null; await ref.set({ slots });
  }

  //=============================================================================
  // STATE HELPERS
  //=============================================================================
  function captureState() {
    if (!emulatorReady) return null;
    try {
      const state = getEmulatorState(); if (!state) return null;
      const sram  = getEmulatorSRAM();
      return { state: uint8ToBase64(state), sram: sram ? uint8ToBase64(sram) : '', t: Date.now() };
    } catch { return null; }
  }
  function applyState(slot) {
    if (!slot?.state) return false;
    try {
      const bytes = base64ToUint8(slot.state);
      const e = window.EJS_emulator;
      if (e?.gameManager?.loadState) { e.gameManager.loadState(bytes); return true; }
      if (e?.loadState)              { e.loadState(bytes); return true; }
      return false;
    } catch { return false; }
  }
  function autoSaveLocal() {
    if (!emulatorReady || !currentUser || !currentROM) return;
    const data = captureState(); if (data) setLocalSave(data);
  }

  //=============================================================================
  // SLOTS MODAL
  //=============================================================================
  async function openSlotsModal() {
    closeMenu();
    document.getElementById('slots-modal')?.remove();
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay'; overlay.id = 'slots-modal';
    const premium   = await checkPremium();
    const localSave = getLocalSave();

    overlay.innerHTML =
      '<div class="modal">' +
        '<h3>💾 Guardar / Cargar</h3>' +
        '<div class="slot-section">' +
          '<div class="slot-section-hdr"><span>📱 Local · Solo en este dispositivo</span><span class="tier-badge">GRATIS</span></div>' +
          '<div class="slot-list" id="local-slot-wrap">' + renderLocalHTML(localSave) + '</div>' +
        '</div>' +
        '<div class="slot-section">' +
          '<div class="slot-section-hdr"><span>☁️ Nube · 10 ranuras</span>' +
            (premium ? '<span class="tier-badge premium">PREMIUM ✓</span>' : '<span class="tier-badge">$1/mes</span>') +
          '</div>' +
          '<div id="cloud-slot-wrap">' + (premium ? '<div class="cloud-msg">Cargando…</div>' : renderPremiumCTA()) + '</div>' +
        '</div>' +
        '<div class="modal-footer"><button class="btn-cancel" id="modal-cancel">Cerrar</button></div>' +
      '</div>';

    if (premium) {
      loadCloudSlots()
        .then(slots => {
          const w = overlay.querySelector('#cloud-slot-wrap');
          if (w) w.innerHTML = '<div class="slot-list">' + slots.map((s,i)=>renderCloudHTML(i,s)).join('') + '</div>';
        })
        .catch(() => {
          const w = overlay.querySelector('#cloud-slot-wrap');
          if (w) w.innerHTML = '<div class="cloud-msg error">Error de conexión.</div>';
        });
    }

    overlay.addEventListener('click', async e => {
      if (e.target === overlay) { overlay.remove(); return; }
      const btn = e.target.closest('[data-sa]'); if (!btn) return;
      const { sa, st, si } = btn.dataset;
      if (st === 'local') await handleLocal(sa, overlay);
      else                await handleCloud(sa, parseInt(si||'0'), overlay);
    });
    overlay.querySelector('#modal-cancel').addEventListener('click', () => overlay.remove());
    document.body.appendChild(overlay);
  }

  function renderLocalHTML(save) {
    const info  = save ? '<span class="slot-date">' + new Date(save.t).toLocaleString() + '</span>' : '<span class="slot-empty">Vacío</span>';
    const extra = save ? '<button class="slot-btn load" data-sa="load" data-st="local">Cargar</button><button class="slot-btn del" data-sa="del" data-st="local">✕</button>' : '';
    return '<div class="slot"><div class="slot-num">1</div><div class="slot-info">' + info + '</div><div class="slot-actions"><button class="slot-btn save" data-sa="save" data-st="local">Guardar</button>' + extra + '</div></div>';
  }
  function renderCloudHTML(idx, save) {
    const i = idx;
    const info  = save ? '<span class="slot-date">' + new Date(save.t).toLocaleString() + '</span>' : '<span class="slot-empty">Vacío</span>';
    const extra = save ? '<button class="slot-btn load" data-sa="load" data-st="cloud" data-si="'+i+'">Cargar</button><button class="slot-btn del" data-sa="del" data-st="cloud" data-si="'+i+'">✕</button>' : '';
    return '<div class="slot"><div class="slot-num">'+(i+1)+'</div><div class="slot-info">'+info+'</div><div class="slot-actions"><button class="slot-btn save" data-sa="save" data-st="cloud" data-si="'+i+'">Guardar</button>'+extra+'</div></div>';
  }
  function renderPremiumCTA() {
    const payBtn = MERCADOPAGO_LINK
      ? '<a href="'+MERCADOPAGO_LINK+'" target="_blank" rel="noopener noreferrer" class="btn-mp">Pagar con MercadoPago</a>'
      : '<div class="btn-mp-disabled">MercadoPago · Próximamente</div>';
    return '<div class="premium-cta"><div class="premium-cta-title">☁️ Guardado en la nube</div><div class="premium-cta-desc">10 ranuras · Acceso desde cualquier dispositivo</div><div class="premium-price">$1.999 <span>/ mes</span></div>' + payBtn + '<div class="premium-note">Después de pagar tu cuenta se activa en las próximas horas.<br>El guardado local siempre es gratis.</div><button class="verify-btn" data-sa="verify" data-st="cloud">Ya pagué — verificar activación</button></div>';
  }

  async function handleLocal(action, overlay) {
    if (action === 'save') {
      const data = captureState(); if (!data) { toast('El emulador no está listo','error'); return; }
      setLocalSave(data);
      trackEvent('partida_guardada', { tipo_save: 'local' });
      overlay.querySelector('#local-slot-wrap').innerHTML = renderLocalHTML(getLocalSave());
      toast('Guardado local ✓');
    } else if (action === 'load') {
      const s = getLocalSave(); if (!s) { toast('No hay guardado local','error'); return; }
      if (applyState(s)) { toast('Cargado ✓'); overlay.remove(); }
      else toast('Error al cargar','error');
    } else if (action === 'del') {
      if (!confirm('¿Borrar el guardado local?')) return;
      setLocalSave(null);
      overlay.querySelector('#local-slot-wrap').innerHTML = renderLocalHTML(null);
      toast('Borrado ✓');
    }
  }

  async function handleCloud(action, idx, overlay) {
    const wrap = overlay.querySelector('#cloud-slot-wrap');
    if (action === 'verify') {
      _isPremium = null; wrap.innerHTML = '<div class="cloud-msg">Verificando…</div>';
      const ok = await checkPremium(true);
      if (ok) {
        loadCloudSlots()
          .then(slots => { wrap.innerHTML = '<div class="slot-list">' + slots.map((s,i)=>renderCloudHTML(i,s)).join('') + '</div>'; })
          .catch(() => { wrap.innerHTML = '<div class="cloud-msg error">Error de conexión.</div>'; });
        toast('¡Premium activado! ✓');
      } else { wrap.innerHTML = renderPremiumCTA(); toast('Tu cuenta aún no tiene Premium activo','error'); }
      return;
    }
    if (action === 'save') {
      const data = captureState(); if (!data) { toast('El emulador no está listo','error'); return; }
      wrap.style.opacity = '0.5';
      try {
        await saveCloudSlot(idx, data);
        const slots = await loadCloudSlots(); wrap.style.opacity = '';
        wrap.innerHTML = '<div class="slot-list">' + slots.map((s,i)=>renderCloudHTML(i,s)).join('') + '</div>';
        trackEvent('partida_guardada', { tipo_save: 'cloud', ranura: idx + 1 });
        toast('Guardado en la nube ✓');
      } catch { wrap.style.opacity = ''; toast('Error al guardar en la nube','error'); }
    } else if (action === 'load') {
      try {
        const slots = await loadCloudSlots();
        if (!slots[idx]?.state) { toast('Ranura vacía','error'); return; }
        if (applyState(slots[idx])) { toast('Cargado desde la nube ✓'); overlay.remove(); }
        else toast('Error al cargar','error');
      } catch { toast('Error de conexión','error'); }
    } else if (action === 'del') {
      if (!confirm('¿Borrar ranura ' + (idx+1) + '?')) return;
      wrap.style.opacity = '0.5';
      try {
        await deleteCloudSlot(idx);
        const slots = await loadCloudSlots(); wrap.style.opacity = '';
        wrap.innerHTML = '<div class="slot-list">' + slots.map((s,i)=>renderCloudHTML(i,s)).join('') + '</div>';
        toast('Borrado ✓');
      } catch { wrap.style.opacity = ''; toast('Error al borrar','error'); }
    }
  }

  // BANNER + NO-ADS
  //=============================================================================
  function setupBanner() {
    if (document.getElementById('game-banner').querySelector('.noads-btn')) return;

    const adSlot = document.getElementById('banner-ad-content');
    adSlot.innerHTML = '';

  function loadStore(key, fallback, useSession) {
    try { const v = (useSession?sessionStorage:localStorage).getItem(key); return v ? JSON.parse(v) : fallback; }
    catch { return fallback; }

  function saveStore(key, value, useSession) { (useSession?sessionStorage:localStorage).setItem(key, JSON.stringify(value)); }
  function delStore(key, useSession)         { (useSession?sessionStorage:localStorage).removeItem(key); }

  //=============================================================================
  // BINARY UTILS
  //=============================================================================
  function uint8ToBase64(u8) {
    if (!u8||u8.length===0) return '';
    let s=''; const chunk=0x8000;
    for (let i=0;i<u8.length;i+=chunk) s+=String.fromCharCode.apply(null,u8.subarray(i,Math.min(i+chunk,u8.length)));
    return btoa(s);
  }
  function base64ToUint8(b64) {
    if (!b64) return new Uint8Array(0);
    const s=atob(b64), u8=new Uint8Array(s.length);
    for (let i=0;i<s.length;i++) u8[i]=s.charCodeAt(i);
    return u8;
  }

  async function loadROMList() {
    const grid = document.getElementById('rom-grid');
    grid.innerHTML = '<div class="empty">Cargando lista…</div>';

    let roms = await detectROMsViaGitHubAPI(currentConsole.folder);
    if (!roms) {
      try {
        const r = await fetch(currentConsole.folder + '/manifest.json', { cache:'no-store' });
        if (r.ok) { const arr = await r.json(); roms = arr.map(n=>({name:n, path:currentConsole.folder+'/'+n})); }
      } catch(_) {}
    }

    const extRe = new RegExp('\\.(' + currentConsole.exts.join('|') + ')$', 'i');
    if (roms) roms = roms.filter(r => extRe.test(r.name));

    if (!roms || roms.length === 0) {
      grid.innerHTML = '<div class="empty error">No hay ROMs en /' + currentConsole.folder + '/.<br><span style="font-size:11px;color:var(--muted)">Subí archivos ' + currentConsole.exts.map(e=>'.'+e).join(', ') + ' a esa carpeta.</span></div>';
      return;
    }

    roms.sort((a,b) => a.name.localeCompare(b.name));
    let manualCovers = {};
    try { const r = await fetch(currentConsole.folder + '/covers.json',{cache:'no-store'}); if(r.ok) manualCovers = await r.json(); } catch(_) {}

    grid.innerHTML = '';
    roms.forEach(rom => {
      const card = document.createElement('div'); card.className = 'rom-card';
      const title = rom.name.replace(extRe,'').replace(/[-_]/g,' ');
      card.innerHTML =
        '<div class="cover"><img alt="" loading="lazy"><div class="fallback">' + currentConsole.emoji + '</div></div>' +
        '<div class="title">' + escapeHTML(title) + '</div>' +
        '<div class="badge" style="color:' + currentConsole.color + '">' + currentConsole.id.toUpperCase() + '</div>';
      card.addEventListener('click', () => selectROM(rom));
      grid.appendChild(card);
      tryLoadCover(card.querySelector('img'), rom, manualCovers[rom.name]);
    });

    const searchInput = document.getElementById('rom-search');
    searchInput.value = '';
    searchInput.oninput = e => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.rom-card').forEach(c => {
        c.style.display = (!q || c.querySelector('.title').textContent.toLowerCase().includes(q)) ? '' : 'none';
      });
    };
  }

  function tryLoadCover(img, rom, manualUrl) {
    const candidates = buildCoverCandidates(rom, manualUrl); let idx = 0;
    img.onload  = () => img.classList.add('loaded');
    img.onerror = () => { idx++; if(idx<candidates.length) img.src=candidates[idx]; else { img.style.display='none'; img.onerror=null; } };
    img.src = candidates[0];
  }

  function buildCoverCandidates(rom, manualUrl) {
    const list = []; if (manualUrl) list.push(manualUrl);
    const extRe = new RegExp('\\.(' + currentConsole.exts.join('|') + ')$', 'i');
    // Quitar extensión y tags de dump: [!], [S], [p1], [b], etc.
    const base   = rom.name.replace(extRe,'').replace(/\s*\[[^\]]*\]/g,'').trim();

    const variants = [];
    const add = s => { const t=(s||'').trim().replace(/\s+/g,' '); if(t&&!variants.includes(t)) variants.push(t); };
    add(base);

    let stripped = base;
    while (/\s*\([^)]*\)\s*$/.test(stripped)) { stripped=stripped.replace(/\s*\([^)]*\)\s*$/,'').trim(); add(stripped); }
    const core = stripped;

    if (core) ['(World)','(USA, Europe)','(USA)','(Europe)','(Japan)',
               '(USA, Europe, Brazil)','(USA, Europe, Korea)','(USA, Australia)',
               '(World) (Rev 1)','(USA, Europe) (Rev 1)','(USA) (Rev 1)'].forEach(t=>add(core+' '+t));

    if (/Pokemon/i.test(base)) variants.slice().forEach(v=>add(v.replace(/Pokemon/g,'Pokémon')));
    variants.slice().forEach(v=>{
      if (/\bII\b/.test(v))  add(v.replace(/\bII\b/g,'2'));
      if (/\b2\b/.test(v))   add(v.replace(/\b2\b/g,'II'));
      if (/\bIII\b/.test(v)) add(v.replace(/\bIII\b/g,'3'));
      if (/\b3\b/.test(v))   add(v.replace(/\b3\b/g,'III'));
    });

    for (const folder of currentConsole.libretro) {
      for (const v of variants) {
        list.push('https://raw.githubusercontent.com/libretro-thumbnails/'+folder+'/master/Named_Boxarts/'+encodeURIComponent(v)+'.png');
      }
    }
    return list;
  }

  async function detectROMsViaGitHubAPI(folder) {
    const host = window.location.hostname;
    if (!host.endsWith('.github.io')) return null;
    const owner = host.split('.')[0];
    const repo  = window.location.pathname.split('/').filter(Boolean)[0] || owner+'.github.io';
    try {
      const r = await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+folder);
      if (!r.ok) return null;
      const files = await r.json();
      if (!Array.isArray(files)) return null;
      const extRe = new RegExp('\\.(' + currentConsole.exts.join('|') + ')$', 'i');
      return files.filter(f=>f.type==='file'&&extRe.test(f.name)).map(f=>({name:f.name, path:folder+'/'+f.name}));
    } catch(e) { console.warn('GitHub API:', e); return null; }
  }

          'style="-webkit-user-select:text;user-select:text;width:100%;padding:10px 12px;background:var(--surface2);' +
          'border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;' +
          'resize:none;font-family:inherit;line-height:1.5"></textarea>' +
        '<div class="msg" id="sup-result" style="margin-top:8px"></div>' +
        '<div class="modal-footer" style="margin-top:14px;gap:8px">' +
          '<button class="btn-cancel" id="sup-cancel">Cancelar</button>' +
          '<button class="btn-primary" id="sup-send" style="flex:1;padding:12px">Enviar</button>' +
        '</div>' +
      '</div>';

    overlay.querySelector('#sup-cancel').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

    overlay.querySelector('#sup-send').addEventListener('click', async () => {
      const msg  = (overlay.querySelector('#sup-msg').value || '').trim();
      const tipo = overlay.querySelector('#sup-tipo').value;
      const res  = overlay.querySelector('#sup-result');
      const btn  = overlay.querySelector('#sup-send');
      if (!msg) { res.className='msg error'; res.textContent='Escribí algo primero.'; return; }
      btn.disabled = true; btn.textContent = 'Enviando…';
      const ticket = {
        tipo, mensaje: msg,
        nombre:  currentUser?.name  || 'Invitado',
        email:   currentUser?.email || '',
        fecha:   new Date().toISOString(),
        uid:     _auth?.currentUser?.uid || null
      };
      let ok = false;
      // Guardar en Firestore
      if (_db) {
        try { await _db.collection('tickets').add({ ...ticket, createdAt: firebase.firestore.FieldValue.serverTimestamp() }); ok = true; }
        catch(e) { console.warn('[FB] ticket:', e); }
      }
      // Guardar en Google Sheet como fallback
      try {
        fetch(APPS_SCRIPT_URL + '?' + new URLSearchParams({ action:'ticket', ...ticket }), { mode:'no-cors' });
        ok = true;
      } catch(_) {}
      if (ok) {
        trackEvent('ticket_enviado', { tipo_ticket: tipo });
        res.className = 'msg ok'; res.textContent = '✓ Mensaje enviado. ¡Gracias!';
        overlay.querySelector('#sup-msg').value = '';
        btn.textContent = 'Enviado ✓'; btn.disabled = true;
        setTimeout(() => overlay.remove(), 2000);
      } else {
        res.className = 'msg error'; res.textContent = 'Error al enviar. Intentá de nuevo.';
        btn.disabled = false; btn.textContent = 'Enviar';
      }
    });

    document.body.appendChild(overlay);
    // Habilitar selección de texto en el textarea
    overlay.querySelector('#sup-msg').addEventListener('touchstart', e => e.stopPropagation(), {passive:true});
    overlay.querySelector('#sup-msg').focus();
  }

  function openControlsModal() {
    document.getElementById('controls-modal')?.remove();

    const CONTROLS = {
      gb:    { name:'Game Boy / GBC', buttons:[['↑↓←→','Flechas'],['A','Z'],['B','X'],['Start','Enter'],['Select','Shift']] },
      nes:   { name:'NES', buttons:[['↑↓←→','Flechas'],['A','Z'],['B','X'],['Start','Enter'],['Select','Shift']] },
      sms:   { name:'Master System', buttons:[['↑↓←→','Flechas'],['Botón 1','Z'],['Botón 2','X'],['Pausa','Enter']] },
      gg:    { name:'Game Gear', buttons:[['↑↓←→','Flechas'],['Botón 1','Z'],['Botón 2','X'],['Start','Enter']] },
      atari: { name:'Atari 2600', buttons:[['↑↓←→','Flechas'],['Fuego','Z'],['Reset','Enter']] }
    };

    const cfg = CONTROLS[currentConsole?.id] || CONTROLS.gb;
    const rows = cfg.buttons.map(([btn, key]) =>
      '<tr>' +
        '<td style="padding:8px 12px;color:var(--muted);text-align:right">' + btn + '</td>' +
        '<td style="padding:8px 12px">' +
          '<kbd style="background:#1a0840;border:1px solid rgba(165,94,240,0.6);border-radius:5px;' +
               'padding:3px 10px;font-size:13px;color:#e0d0ff;font-family:monospace">' + key + '</kbd>' +
        '</td>' +
      '</tr>'
    ).join('');

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay'; overlay.id = 'controls-modal';
    overlay.innerHTML =
      '<div class="modal" style="max-width:320px">' +
        '<h3 style="margin:0 0 4px">🎮 ' + cfg.name + '</h3>' +
        '<p style="color:var(--muted);font-size:12px;margin:0 0 16px">Controles de teclado</p>' +
        '<table style="width:100%;border-collapse:collapse">' + rows + '</table>' +
        '<hr style="border-color:var(--border);margin:16px 0 12px">' +
        '<p style="color:var(--muted);font-size:12px;margin:0;text-align:center">' +
          '📱 En celular aparecen controles táctiles automáticamente' +
        '</p>' +
        '<div class="modal-footer" style="margin-top:14px">' +
          '<button class="btn-cancel" id="controls-close">Cerrar</button>' +
        '</div>' +
      '</div>';

    overlay.querySelector('#controls-close').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
  }

  //=============================================================================
  // KIOSK PROTECTION
  //=============================================================================
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey||e.metaKey) && 'spuojwtnrdh'.includes((e.key||'').toLowerCase())) e.preventDefault();
  });
  window.addEventListener('dragover', e=>e.preventDefault());
  window.addEventListener('drop',     e=>e.preventDefault());
  document.addEventListener('gesturestart', e=>e.preventDefault());

  //=============================================================================
  // ENTRY POINT
  //=============================================================================
  function enterApp(user) {
    currentUser = user;
    document.getElementById('hello-consoles').textContent = 'Hola, ' + user.name;
    setupBanner();

    const romData     = loadStore(STORE.CURRENT_ROM,     null, true);
    const consoleId   = loadStore(STORE.CURRENT_CONSOLE, null, true);
    const consoleCfg  = CONSOLES.find(c => c.id === consoleId);

    if (consoleCfg && romData?.name && romData?.path) {
      currentConsole = consoleCfg;
      bootEmulator(romData);
    } else if (consoleCfg) {
      currentConsole = consoleCfg;
      document.getElementById('picker-title').textContent = consoleCfg.emoji + ' ' + consoleCfg.name;
      showScreen('picker');
      loadROMList();
    } else {
      loadConsoleMenu();
      showScreen('consoles');
    }
  }

  window.addEventListener('beforeunload', () => { if(currentROM&&emulatorReady) autoSaveLocal(); });
  window.addEventListener('pagehide',     () => { if(currentROM&&emulatorReady) autoSaveLocal(); });

  (async function init() {
    initFirebase();
    // Cargar script de GA4 solo si el ID está configurado
    if (GA4_ID) {
      const s = document.createElement('script');
      s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID;
      document.head.appendChild(s);
      s.onload = () => gtag('config', GA4_ID);
    }

    // Handle returning from email link click — signs in and grants no-ads automatically
    if (_auth && _auth.isSignInWithEmailLink(window.location.href)) {
      const linkEmail = localStorage.getItem('arcade_emaillink') || '';
      if (linkEmail) {
        try {
          await _auth.signInWithEmailLink(linkEmail, window.location.href);
          localStorage.removeItem('arcade_emaillink');
          localStorage.setItem('arcade_noads_' + linkEmail, '1');
          window.history.replaceState({}, '', window.location.pathname);
          // Marcar verified: true en Firestore
          if (_auth.currentUser && _db) {
            try {
              await _db.doc('users/' + _auth.currentUser.uid).set(
                { verified: true, verifiedAt: firebase.firestore.FieldValue.serverTimestamp() },
                { merge: true }
              );
            } catch(_) {}
          }
          // Persist no-ads en sesión local
          const s = loadStore(STORE.SESSION, null);
          if (s) { s.noAds = true; saveStore(STORE.SESSION, s); }
        } catch(e) { console.warn('[FB] email link:', e.code); }
      }
    }

    const session = loadStore(STORE.SESSION, null);
    if (session?.name) {
      // Usuarios Google: Firebase ya restaura la sesión solo (no necesitamos firebaseSignIn)
      // Usuarios legacy email: intentar sign-in en background para cloud saves
      if (session.email && !session.guest && !session.noAds) firebaseSignIn(session.email);
      enterApp(session);
      return;
    }
    showScreen('register');
  })();
  </script>
</body>
