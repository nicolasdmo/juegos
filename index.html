<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="referrer" content="no-referrer">
<title>Juego</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    color: #ccc;
  }
  canvas#screen {
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    width: min(100vw, calc(100vh * 160 / 144));
    height: min(100vh, calc(100vw * 144 / 160));
    background: #000;
    display: block;
    outline: none;
  }
  #status {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: monospace;
    font-size: 16px;
    text-align: center;
    pointer-events: none;
  }
  #status.error { color: #ff6666; }
  #hint {
    position: fixed;
    bottom: 8px; right: 12px;
    font-family: monospace;
    font-size: 11px;
    color: #444;
    pointer-events: none;
  }
</style>
</head>
<body oncontextmenu="return false" ondragstart="return false" onselectstart="return false">

  <canvas id="screen" width="160" height="144" tabindex="0"></canvas>
  <div id="status">Cargando…</div>
  <div id="hint">F = pantalla completa</div>

  <!-- GameBoy Online (Grant Galitz) - cargado desde jsDelivr -->
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online@master/js/other/base64.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online@master/js/other/resize.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online@master/js/other/resampler.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online@master/js/other/XAudioServer.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/taisel/GameBoy-Online@master/js/GameBoyCore.js"></script>

  <script>
  // Stub de cout(): GameBoyCore.js usa esta función (que normalmente vive en
  // GameBoyIO.js) para loggear. La definimos acá para no tener que cargar
  // todo GameBoyIO.js (que trae UI propia que no queremos).
  window.cout = function (message, colorIndex) {
    try {
      if (colorIndex === 2)      console.error(message);
      else if (colorIndex === 1) console.warn(message);
      else                       console.log(message);
    } catch (_) {}
  };
  // Otros helpers que GameBoyCore puede tocar:
  window.clear_terminal = function () {};
  window.pause = window.pause || function () {};
  </script>

  <script>
  (function () {
    'use strict';

    var statusEl = document.getElementById('status');
    var canvas   = document.getElementById('screen');

    // ----- CONFIGURACIÓN -----
    // Ruta al ROM. Cambiá esto si tu ROM tiene otro nombre.
    var ROM_PATH = 'mon.gb';

    // settings[] global usado internamente por GameBoyCore.
    // Mapeo de teclas (settings[14]):
    //   [Right, Left, Up, Down, A, B, Select, Start]
    //   Por defecto: Flechas, X, Z, Shift, Enter
    window.settings = [
      true,   // 0  sonido on
      true,   // 1  boot con boot ROM
      false,  // 2  forzar modo GB
      false,  // 3  prioridad a modo GB
      false,  // 4  usar BIOS GBC
      false,  // 5  desactivar colorización en modo GB
      false,  // 6  prohibir typed arrays
      8,      // 7  intervalo del loop (ms)
      10,     // 8  buffer audio mínimo
      20,     // 9  buffer audio máximo
      false,  // 10 override MBC1 RAM
      false,  // 11 usar boot ROM de GB en vez del de GBC
      false,  // 12 escalar canvas en JS
      true,   // 13 image smoothing
      [39, 37, 38, 40, 88, 90, 16, 13], // 14 keymap
      false,  // 15
      0x3f,   // 16 canales de sonido (bitmask)
      false,  // 17
      true,   // 18
      true,   // 19
      false,  // 20
      false,  // 21
      false,  // 22
      false,  // 23
      false,  // 24
      false   // 25
    ];

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = isError ? 'error' : '';
      statusEl.style.display = '';
    }

    function hideStatus() {
      statusEl.style.display = 'none';
    }

    async function loadROM(path) {
      var res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) throw new Error('No se pudo cargar ' + path + ' (HTTP ' + res.status + ')');
      var buf = await res.arrayBuffer();
      var bytes = new Uint8Array(buf);
      // GameBoyCore espera el ROM como string binario (1 char = 1 byte)
      var s = '';
      var chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return s;
    }

    function bindKeyboard(gameboy) {
      var keys = settings[14];
      var keymap = {};
      for (var i = 0; i < keys.length; i++) keymap[keys[i]] = i;

      function onKey(e, pressed) {
        // Game pad
        if (keymap.hasOwnProperty(e.keyCode)) {
          try { gameboy.JoyPadEvent(keymap[e.keyCode], pressed); } catch (_) {}
          e.preventDefault();
          return;
        }
        // Pantalla completa con F
        if (pressed && (e.key === 'f' || e.key === 'F')) {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(function(){});
          } else {
            document.exitFullscreen().catch(function(){});
          }
          e.preventDefault();
        }
        // Bloquear atajos del navegador (Ctrl/Cmd + cualquier cosa)
        if (e.ctrlKey || e.metaKey) {
          // Permitimos F5 normal (sin ctrl). Si querés bloquear F5 también, descomentá la línea siguiente.
          // if (e.key === 'r' || e.key === 'R') e.preventDefault();
          e.preventDefault();
        }
      }

      document.addEventListener('keydown', function (e) { onKey(e, true);  });
      document.addEventListener('keyup',   function (e) { onKey(e, false); });

      // Bloquear drag & drop (que no puedan soltar otro ROM)
      window.addEventListener('dragover', function (e) { e.preventDefault(); });
      window.addEventListener('drop',     function (e) { e.preventDefault(); });
    }

    function runGame(romString) {
      var gameboy;
      try {
        gameboy = new GameBoyCore(canvas, romString);
        gameboy.start();
      } catch (e) {
        setStatus('Error al iniciar emulador: ' + (e && e.message || e), true);
        return;
      }

      hideStatus();

      var ms = settings[7] || 8;
      var loop = setInterval(function () {
        try { gameboy.run(); }
        catch (e) {
          clearInterval(loop);
          setStatus('Error en ejecución: ' + (e && e.message || e), true);
        }
      }, ms);

      bindKeyboard(gameboy);

      // Algunos navegadores requieren un gesto del usuario para habilitar audio.
      // Tocamos resume() al primer input.
      function unlockAudio() {
        try {
          if (window.AudioContext || window.webkitAudioContext) {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!unlockAudio._ctx) {
              unlockAudio._ctx = new Ctx();
            }
            if (unlockAudio._ctx.state === 'suspended') {
              unlockAudio._ctx.resume();
            }
          }
        } catch (_) {}
      }
      window.addEventListener('keydown', unlockAudio, { once: true });
      window.addEventListener('click',   unlockAudio, { once: true });
    }

    function boot() {
      if (typeof GameBoyCore !== 'function') {
        setStatus('No se pudo cargar el emulador (revisá la conexión).', true);
        return;
      }
      setStatus('Cargando ROM…');
      loadROM(ROM_PATH)
        .then(runGame)
        .catch(function (err) {
          setStatus(err.message || 'Error desconocido cargando el ROM.', true);
        });
    }

    if (document.readyState === 'complete') boot();
    else window.addEventListener('load', boot);
  })();
  </script>
</body>
</html>
